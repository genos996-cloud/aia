<head>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', "'SF Pro TC'", "'SF Pro Display'", "'PingFang TC'", "'Noto Sans TC'", 'sans-serif'],
            mono: ["'JetBrains Mono'", 'monospace']
          },
          colors: {
            brand: {
              navy: '#0B132B',
              blue: '#004B93',      /* Bauerfeind Medical Cobalt */
              blueLight: '#EBF3FA',
              teal: '#00897B',      /* Conzian Smart MedTech Teal */
              tealLight: '#E6F4F1',
              surface: '#F8FAFC',
              border: '#CBD5E1'
            }
          }
        }
      }

  </script>
  <style>
    :root {
      --mouse-x: 50%;
      --mouse-y: 50%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro TC', 'SF Pro Display', 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #F1F5F9;
      color: #0F172A;
      font-size: 1.25rem; /* 20px Base (+25% for TV/Projector clarity) */
      line-height: 1.75;
      letter-spacing: 0.015em;
    }
    h1, h2, h3, h4 {
      letter-spacing: -0.02em;
    }

    /* Ambient Cursor Aura on Main Viewport */
    #mainViewport {
      position: relative;
      background: radial-gradient(
        750px circle at var(--mouse-x) var(--mouse-y),
        rgba(0, 75, 147, 0.07),
        rgba(0, 137, 123, 0.03) 40%,
        transparent 80%
      );
    }

    /* Interactive Cards: Mouse Spotlight + 3D Lift + Sibling Focus Dimming */
    .interactive-grid:hover .interactive-card:not(:hover) {
      opacity: 0.58;
      transform: scale(0.99);
      filter: grayscale(15%);
    }
    .interactive-card {
      position: relative;
      overflow: hidden;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      border: 2px solid #E2E8F0;
      background: #FFFFFF;
    }
    .interactive-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        480px circle at var(--card-mouse-x, -500px) var(--card-mouse-y, -500px),
        rgba(0, 75, 147, 0.09),
        transparent 70%
      );
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .interactive-card:hover {
      transform: translateY(-6px) scale(1.012);
      border-color: #004B93;
      box-shadow: 0 20px 38px -12px rgba(0, 75, 147, 0.18), 0 0 0 1px rgba(0, 75, 147, 0.15);
      z-index: 10;
    }
    .interactive-card:hover::before {
      opacity: 1;
    }
    .interactive-card.teal-accent:hover {
      border-color: #00897B;
      box-shadow: 0 20px 38px -12px rgba(0, 137, 123, 0.2), 0 0 0 1px rgba(0, 137, 123, 0.15);
    }

    /* Sidebar Active State */
    .nav-btn {
      transition: all 0.2s ease;
      border-left: 5px solid transparent;
    }
    .nav-btn-active {
      background: linear-gradient(90deg, rgba(0, 75, 147, 0.35) 0%, rgba(0, 75, 147, 0.05) 100%);
      border-left-color: #38BDF8;
      color: #FFFFFF !important;
      transform: translateX(4px);
    }
    .nav-btn-inactive {
      color: #94A3B8;
    }
    .nav-btn-inactive:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #F8FAFC;
      transform: translateX(3px);
    }

    /* Smooth Page Switch Animation */
    .page-enter {
      animation: pageSlideIn 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pageSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 4px; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col lg:flex-row select-none sm:select-auto">

  <!-- Mobile Header -->
  <div class="lg:hidden bg-brand-navy text-white px-5 py-3.5 flex items-center justify-between border-b border-slate-800 shrink-0 z-30">

  <!-- Left Sidebar (~22% width, Fixed Navigation) -->

          <div class="text-xl font-semibold text-white mt-0.5">郭奕正 <span class="text-sm font-normal text-sky-300 ml-1">營運專員</span></div>

    <!-- 7-Page Navigation List -->

    <!-- Bottom Keyboard & Interaction Hint -->
    <div class="p-5 bg-slate-950/90 border-t border-slate-800/90 text-xs text-slate-400 space-y-1.5">

  <!-- Right Main Content Area (~78% width) -->
  <main id="mainViewport" class="flex-1 flex flex-col h-full overflow-hidden">
    
    <!-- Top Page Title Banner -->
    <header class="bg-white/95 backdrop-blur border-b border-slate-200 px-8 py-5 flex flex-wrap items-center justify-between gap-4 shrink-0 shadow-sm z-10">
      <div class="flex items-center space-x-4">
        <span id="pageBadge" class="px-3.5 py-1.5 text-sm font-mono font-semibold bg-brand-blue text-white rounded-lg shadow-sm">
          PAGE 01

            不靠口頭承諾，直接用可驗證的專案管理實績與系統架構對齊 CEO 的每一項規格需求
          </p>
        </div>
      </div>

      <!-- Page Stepper Controls -->
      <div class="flex items-center space-x-3">
        <button id="prevBtn" onclick="changePage(-1)" class="px-4 py-2 rounded-lg border-2 border-slate-300 hover:border-brand-blue hover:text-brand-blue text-slate-700 font-medium text-base transition disabled:opacity-30">
          ← 上一頁
        </button>
        <span id="pageCounter" class="font-mono text-lg font-semibold text-slate-800 px-2">01 / 07</span>
        <button id="nextBtn" onclick="changePage(1)" class="px-4 py-2 rounded-lg bg-brand-blue hover:bg-blue-800 text-white font-medium text-base shadow-sm transition disabled:opacity-30">
          下一頁 →
        </button>
      </div>
    </header>

    <!-- Active Page Content Container -->
    <div id="contentArea" class="flex-1 overflow-y-auto px-8 py-7">
      <!-- Dynamic Page Content Injected Here -->
    </div>

  </main>

  <script>
    // =========================================================================
    // 7-PAGE COMPLETE DATA STRUCTURE (01 TO 07)
    // =========================================================================
    let currentPage = 0;

    const pages = [
      {

      },
      {

      {

        navTitle: '缺口補全｜拒絕 AI 幻覺與盲猜',
        navSub: '資料不全怎麼補？卡住怎麼推？',
        title: '缺口補全與查核｜AI 給框架，真實數據靠雙腳跑出來',

      },
      {
        code: '04',
        navTitle: '商品上市變現｜上架賣貨全準備',
        navSub: '選址、定價毛利、必要與加分項',
        title: '商品上市變現｜怎麼讓產品順利上架、賣給客人並獲利？',
        subtitle: '把「上市準備」拆成硬核執行清單：從成本定價、法規字號、通路鋪貨到首波銷售轉換'
      },
      {
        code: '05',

        navSub: '據點評估、醫療合作與流程防呆',

        subtitle: '一邊顧好德國護具的現金流與新據點，一邊把智慧醫材的醫院展示與測試盯到簽約'
      },
      {
        code: '06',
        navTitle: 'AI 自動化實戰｜Claude / Codex',
        navSub: '行銷排程、廣告監控與人工查核',
        title: 'AI 自動化實戰｜把煩人重複的報表與排程交給系統跑',
        subtitle: '用 Claude 處理文案與翻譯初稿，用 Codex 算準廣告與銷售數字，最後由人工把關合規'
      },
      {
        code: '07',
        navTitle: '授權邊界與階段推進｜分階段落地',
        navSub: '清楚分際，依優先順序逐步見效',
        title: '授權邊界與階段推進｜不越權、不推託，穩步落地見效',
        subtitle: '清楚區分「我自己搞定、找人協調、請您核准」三條線，依優先順序逐步幫您拔掉最痛的石頭'
      }
    ];

    // =========================================================================
    // NAVIGATION & RENDERING LOGIC
    // =========================================================================
    function renderNav() {
      const nav = document.getElementById('navList');
      nav.innerHTML = pages.map((p, idx) => {
        const active = idx === currentPage;
        return `
          <button onclick="goToPage(${idx})" class="nav-btn w-full text-left px-6 py-4 flex items-start space-x-3.5 ${active ? 'nav-btn-active' : 'nav-btn-inactive'}">
            <span class="font-mono text-base font-semibold mt-0.5 ${active ? 'text-sky-400' : 'text-slate-500'}">${p.code}</span>
            <div class="flex-1 min-w-0">
              <div class="text-lg font-semibold truncate">${p.navTitle}</div>
              <div class="text-sm font-normal truncate mt-0.5 ${active ? 'text-sky-200' : 'text-slate-400'}">${p.navSub}</div>
            </div>
          </button>
        `;
      }).join('');
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    }

    function goToPage(idx) {
      currentPage = idx;
      const sb = document.getElementById('sidebar');
      if (!sb.classList.contains('-translate-x-full') && window.innerWidth < 1024) {
        sb.classList.add('-translate-x-full');
      }
      renderNav();
      const p = pages[currentPage];
      document.getElementById('pageBadge').textContent = `PAGE ${p.code}`;
      document.getElementById('pageTitle').textContent = p.title;
      document.getElementById('pageSubtitle').textContent = p.subtitle;
      document.getElementById('pageCounter').textContent = `0${currentPage + 1} / 0${pages.length}`;
      document.getElementById('prevBtn').disabled = currentPage === 0;
      document.getElementById('nextBtn').disabled = currentPage === pages.length - 1;

      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = `<div class="page-enter max-w-6xl mx-auto space-y-6">${getPageHTML(currentPage)}</div>`;
      contentArea.scrollTop = 0;
      bindCardSpotlights();
    }

    function changePage(delta) {
      const next = currentPage + delta;
      if (next >= 0 && next < pages.length) goToPage(next);
    }

    // Keyboard Navigation Support for Smooth Presentation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        changePage(1);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        changePage(-1);
      }
    });

    // Mouse Spotlight Tracking on Main Viewport & Individual Cards
    document.addEventListener('mousemove', (e) => {
      const viewport = document.getElementById('mainViewport');
      if (viewport) {
        const rect = viewport.getBoundingClientRect();
        viewport.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
        viewport.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
      }
    });

    function bindCardSpotlights() {
      const cards = document.querySelectorAll('.interactive-card');
      cards.forEach(card => {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty('--card-mouse-x', `${e.clientX - rect.left}px`);
          card.style.setProperty('--card-mouse-y', `${e.clientY - rect.top}px`);
        });
      });
    }

    // =========================================================================
    // PAGE CONTENT TEMPLATES (LARGE FONT, DIRECT SPOKEN TONE, HIGH IMPACT)
    // =========================================================================
    function getPageHTML(idx) {
      switch (idx) {
        case 0: return page01HTML();
        case 1: return page02HTML();
        case 2: return page03HTML();
        case 3: return page04HTML();
        case 4: return page05HTML();
        case 5: return page06HTML();
        case 6: return page07HTML();
      }
    }

    // -------------------------------------------------------------------------
    // PAGE 01: 錄取驗證｜CEO 需求規格對照表 ＋ 過去專案經理實績證明
    // -------------------------------------------------------------------------

        },

        },
        {
          id: 'SPEC 03',

      ];

      const trackRecords = [
        {
          code: '實績 01',

        {
